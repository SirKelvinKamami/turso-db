autoDeploy: true
services:
  - type: web
    name: turso-db
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: BIND_ADDRESS
        value: "0.0.0.0:10000"
      - key: DATA_DIR
        value: "/data"
      # Secrets are set in the Render dashboard (Sync: false).
      # Passwords/secrets must NOT be committed to this file.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: RUST_LOG
        value: "turso_service=info"
      - key: ANALYTICS_RETENTION_HOURS
        value: "168"
      - key: SEED_USERS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    disk:
      mountPath: /data
      sizeGB: 1
