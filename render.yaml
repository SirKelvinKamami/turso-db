autoDeploy: true
services:
  - type: web
    name: turso-db
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: BIND_ADDRESS
        value: "0.0.0.0:10000"
      - key: DATA_DIR
        value: "/data"
      # Secrets are set in the Render dashboard (Sync: false).
      # Passwords/secrets must NOT be committed to this file.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: RUST_LOG
        value: "turso_service=info"
      - key: ANALYTICS_RETENTION_HOURS
        value: "168"
      - key: SEED_USERS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SYNC_ENABLED
        value: "false"
      - key: SYNC_HUB_URL
        sync: false
      - key: SYNC_HUB_TOKEN
        sync: false
      - key: SYNC_POLL_MS
        value: "5000"
    disk:
      mountPath: /data
      sizeGB: 1
  # Self-hosted libsql hub that the turso-service replicas converge with.
  # NOTE: free instances have no persistent disk, so the hub SQLite data is
  # ephemeral. Upgrade to a paid plan + disk before flipping SYNC_ENABLED on
  # the production service.
  - type: web
    name: turso-db-hub
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.hub
    healthCheckPath: /health
    envVars:
      # EdDSA JWT public key (base64url) that turso-service replica tokens must
      # be signed with. Set in the Render dashboard (Sync: false); without it the
      # hub rejects every sync request with 401.
      - key: SQLD_AUTH_JWT_KEY
        sync: false
      - key: SQLD_HTTP_LISTEN_ADDR
        value: "0.0.0.0:8080"
      - key: SQLD_DB_PATH
        value: "data.sqld"
      - key: RUST_LOG
        value: "sqld=info"
