[package]
name = "turso-service"
version = "1.0.0"
edition = "2024"
description = "A self-hosted, privacy-first database service powered by Turso"
license = "MIT"

[dependencies]
turso = "0.7"
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
dashmap = "6"
toml = "0.8"
thiserror = "2"
dotenvy = "0.15"

[profile.release]
opt-level = 3
strip = true
