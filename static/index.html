<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turso Database Service</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        
        .login-container { max-width: 400px; margin: 100px auto; padding: 40px; background: #1e293b; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .login-container h1 { text-align: center; margin-bottom: 8px; color: #38bdf8; font-size: 28px; }
        .login-container p { text-align: center; color: #94a3b8; margin-bottom: 32px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-google { background: #fff; color: #333; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-google:hover { background: #f1f5f9; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #f87171; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #4ade80; }
        .btn-sm { padding: 8px 16px; width: auto; font-size: 14px; }
        
        .divider { display: flex; align-items: center; margin: 24px 0; color: #64748b; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
        .divider span { padding: 0 12px; font-size: 14px; }
        
        .dashboard { display: none; }
        .header { background: #1e293b; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { color: #38bdf8; font-size: 20px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; }
        .header .user-info span { color: #94a3b8; }
        
        .main { padding: 24px; max-width: 1200px; margin: 0 auto; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; }
        .stat-card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #38bdf8; }
        
        .section { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .section h2 { margin-bottom: 16px; color: #f1f5f9; font-size: 18px; }
        
        .db-list { list-style: none; }
        .db-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; }
        .db-item .name { font-weight: 600; }
        .db-item .id { color: #64748b; font-size: 12px; }
        .db-item .actions { display: flex; gap: 8px; }
        
        .sql-editor { width: 100%; min-height: 120px; padding: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; resize: vertical; }
        .sql-editor:focus { outline: none; border-color: #38bdf8; }
        
        .results-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .results-table th, .results-table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #334155; }
        .results-table th { background: #0f172a; color: #94a3b8; font-weight: 600; }
        .results-table tr:hover td { background: #0f172a; }
        
        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .message.success { background: #065f46; color: #6ee7b7; }
        .message.error { background: #7f1d1d; color: #fca5a5; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        
        #g_id_onload { display: none; }
        
        @media (max-width: 640px) {
            .login-container { margin: 20px; padding: 24px; }
            .header { flex-direction: column; gap: 12px; }
            .db-item { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="g_id_onload"
         data-client_id="868421879875-7a381i4rrvma6elc85v5ru625jh9645i.apps.googleusercontent.com"
         data-callback="handleGoogleSignIn">
    </div>

    <div id="login" class="login-container">
        <h1>Turso Database</h1>
        <p>Privacy-first database service</p>
        
        <div id="login-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        
        <div class="divider"><span>or</span></div>
        
        <div id="g_id_signin" class="g_id_signin" style="width:100%;"></div>
    </div>
    
    <div id="dashboard" class="dashboard">
        <div class="header">
            <h1>Turso Database</h1>
            <div class="user-info">
                <span id="user-email"></span>
                <button class="btn btn-danger btn-sm" onclick="logout()">Sign Out</button>
            </div>
        </div>
        
        <div class="main">
            <div id="dash-message"></div>
            
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Databases</h3>
                    <div class="value" id="db-count">0</div>
                </div>
                <div class="stat-card">
                    <h3>Server Status</h3>
                    <div class="value" style="color: #22c55e">Online</div>
                </div>
            </div>
            
            <div class="section">
                <h2>Create New Database</h2>
                <div style="display: flex; gap: 12px;">
                    <input type="text" id="new-db-name" placeholder="Database name" style="flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 16px;">
                    <button class="btn btn-success btn-sm" onclick="createDatabase()">Create</button>
                </div>
            </div>
            
            <div class="section">
                <h2>Your Databases</h2>
                <ul class="db-list" id="db-list"></ul>
            </div>
            
            <div class="section">
                <h2>SQL Editor</h2>
                <select id="db-select" style="width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; margin-bottom: 12px;">
                    <option value="">Select a database</option>
                </select>
                <textarea id="sql-input" class="sql-editor" placeholder="Enter your SQL query here..."></textarea>
                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button class="btn btn-primary btn-sm" onclick="executeSQL()">Execute (Write)</button>
                    <button class="btn btn-success btn-sm" onclick="runQuery()">Query (Read)</button>
                </div>
                <div id="sql-results"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/v1';
        let token = localStorage.getItem('token');
        let databases = [];

        if (token) showDashboard();

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    showDashboard();
                } else {
                    showMessage('login-message', data.error || 'Login failed', 'error');
                }
            } catch (err) {
                showMessage('login-message', 'Connection error', 'error');
            }
        };

        function handleGoogleSignIn(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            const email = payload.email;
            const name = payload.name;
            
            fetch(`${API_BASE}/auth/google-token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, name })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    localStorage.setItem('user-email', email);
                    showDashboard();
                } else {
                    showMessage('login-message', data.error || 'Google sign-in failed', 'error');
                }
            })
            .catch(err => showMessage('login-message', 'Google sign-in error', 'error'));
        }

        function showDashboard() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-email').textContent = localStorage.getItem('user-email') || 'Admin';
            loadDatabases();
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            localStorage.removeItem('user-email');
            document.getElementById('login').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            if (google && google.accounts) google.accounts.id.disableAutoSelect();
        }

        async function loadDatabases() {
            try {
                const res = await fetch(`${API_BASE}/databases`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) { logout(); return; }
                
                databases = await res.json();
                document.getElementById('db-count').textContent = databases.length;
                
                const list = document.getElementById('db-list');
                const select = document.getElementById('db-select');
                
                if (databases.length === 0) {
                    list.innerHTML = '<div class="empty-state">No databases yet. Create one above!</div>';
                    select.innerHTML = '<option value="">No databases available</option>';
                    return;
                }
                
                list.innerHTML = databases.map(db => `
                    <li class="db-item">
                        <div>
                            <div class="name">${db}</div>
                            <div class="id">${db}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="selectDb('${db}')">Select</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDb('${db}')">Delete</button>
                        </div>
                    </li>
                `).join('');
                
                select.innerHTML = '<option value="">Select a database</option>' + 
                    databases.map(db => `<option value="${db}">${db}</option>`).join('');
            } catch (err) {
                showMessage('dash-message', 'Failed to load databases', 'error');
            }
        }

        function selectDb(name) {
            document.getElementById('db-select').value = name;
        }

        async function createDatabase() {
            const name = document.getElementById('new-db-name').value.trim();
            if (!name) return;
            
            try {
                const res = await fetch(`${API_BASE}/databases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ name })
                });
                
                if (res.ok) {
                    document.getElementById('new-db-name').value = '';
                    showMessage('dash-message', `Database "${name}" created`, 'success');
                    loadDatabases();
                } else {
                    const data = await res.json();
                    showMessage('dash-message', data.error, 'error');
                }
            } catch (err) {
                showMessage('dash-message', 'Failed to create database', 'error');
            }
        }

        async function deleteDb(name) {
            if (!confirm(`Delete database "${name}"?`)) return;
            
            try {
                await fetch(`${API_BASE}/databases/${name}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                showMessage('dash-message', `Database "${name}" deleted`, 'success');
                loadDatabases();
            } catch (err) {
                showMessage('dash-message', 'Failed to delete database', 'error');
            }
        }

        async function executeSQL() {
            const db = document.getElementById('db-select').value;
            const sql = document.getElementById('sql-input').value.trim();
            if (!db || !sql) { showMessage('sql-results', 'Select a database and enter SQL', 'error'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/databases/${db}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ sql })
                });
                
                const data = await res.json();
                if (res.ok) {
                    showMessage('sql-results', data.message, 'success');
                    loadDatabases();
                } else {
                    showMessage('sql-results', data.error, 'error');
                }
            } catch (err) {
                showMessage('sql-results', 'Failed to execute', 'error');
            }
        }

        async function runQuery() {
            const db = document.getElementById('db-select').value;
            const sql = document.getElementById('sql-input').value.trim();
            if (!db || !sql) { showMessage('sql-results', 'Select a database and enter SQL', 'error'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/databases/${db}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ sql })
                });
                
                const data = await res.json();
                if (res.ok && data.rows) {
                    let html = '<table class="results-table"><thead><tr>';
                    data.columns.forEach(col => html += `<th>${col}</th>`);
                    html += '</tr></thead><tbody>';
                    data.rows.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => html += `<td>${cell}</td>`);
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    document.getElementById('sql-results').innerHTML = html;
                } else {
                    showMessage('sql-results', data.error || 'No results', 'error');
                }
            } catch (err) {
                showMessage('sql-results', 'Failed to query', 'error');
            }
        }

        function showMessage(elementId, msg, type) {
            document.getElementById(elementId).innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => { document.getElementById(elementId).innerHTML = ''; }, 5000);
        }
    </script>
</body>
</html>
